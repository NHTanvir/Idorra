[workspace]
resolver = "2"
members = ["crates/idorra-core", "crates/idorra-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["NHTanvir"]
repository = "https://github.com/NHTanvir/Idorra"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
governor = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
thiserror = "1"
tracing = "0.1"
url = "2"

[workspace.lints.clippy]
# Enforce the outbound-HTTP choke point: constructing a reqwest client is denied
# crate-wide (see clippy.toml for the method list); http/client.rs opts back in.
disallowed_methods = "deny"

[profile.release]
lto = "thin"
strip = true
